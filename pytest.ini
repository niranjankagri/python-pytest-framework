[pytest]
testpaths = tests
# -ra: short summary of every non-passing test; strict markers: a typo in a marker fails the run;
# the demo tests (fail, skip, xfail on purpose) only run when asked for with -m demo
addopts = -ra --strict-markers -m "not demo"

markers =
    api: REST API tests (no browser)
    ui: browser tests through the Notes web app
    e2e: hybrid tests that use the API and the UI together
    smoke: the fastest checks of the most important paths
    demo: fail, skip and xfail on purpose to show the report (run with -m demo)
